beclust3d_path: ../../beclust3d-public
screen_dir: ./data/MORC2
output_dir: ./output/MORC2
input_gene: MORC2
input_uniprot: Q9Y6X9
input_chain: A
screens: Human_InVitro_HS294T_Apobec_D24_Input.tsv, Human_InVitro_HS294T_TadA_D14_Input.tsv,
  Mouse_InVitro_B16_TadA_D14-IFNg_Input.tsv,Mouse_InVivo_LLC_Apobec_Tx_NSG.tsv
user_fasta: null
user_pdb: ./pdb/MORC2.pdb
sequence_source: structure # structure (default): sequence from the AF model / user_pdb, UniProt fallback on gaps or length mismatch; uniprot: always UniProt; user_fasta overrides both
on_residue_mismatch: warn # warn (default): report screen edits whose residue disagrees with the PDB/reference and continue; error: stop the run
user_dssp: null
nRandom: 500
pthr:
  single_screen: 0.05
  multi_screen: 0.001
structure_radius: 6.0
clustering_radius: 6.0
skip_no_coords: true
function_for_lfc: mean
function_for_lfc3d: mean
function_for_meta: SUM
database:
  edit_categories_col: Mutation_type # per-edit list (e.g. Silent;Missense), collapsed with category_priority
  val_col: sgRNA_score
  gene_col: Gene
  aa_edits_col: Mutation_list
  edit_delimiter: ;
conservation:
  run: true
  v_score_threshold: 3
  alt_gene_name: Morc2a
  alt_uniprot_id: Q69ZX6
  alt_screen_start: Mouse
  user_fasta: null # local FASTA for the primary sequence instead of querying input_uniprot
  alt_user_fasta: null # local FASTA for the alternative sequence instead of querying alt_uniprot_id
  alignment_filename: null # precomputed Clustal alignment (primary first); skips both FASTAs and MUSCLE
priority_on_alternative: false
category_labels:
  missense: [Missense]
  silent: [Silent]
  nonsense: [Nonsense]
  no_mutation: [No Mutation]
  splice: [Splice-donor, Splice-acceptor]
  intron: [Intron]
# most-to-least-deleterious order for collapsing a guide's per-edit categories into one;
# this order matches the per-guide categories these screens were originally assigned
category_priority: [Nonsense, Splice-donor, Splice-acceptor, Missense, Intron, Silent, UTR, Flank, No Mutation]
# negative controls for the per-screen LFC z-score null, independent of qa.controls;
# defaults to the category_labels no_mutation labels
null_controls: [No Mutation]
qa:
  qa_passed_only: false
  qa_only: false
  cases: [Nonsense, Splice-donor, Splice-acceptor]
  controls: [No Mutation] # negative controls for the QA hypothesis tests; e.g. [No Mutation, Silent]
ppi_chain_gene_dict: null
ppi_gene_edits_dict: null
atom_level_naa: false
muscle_path: muscle
