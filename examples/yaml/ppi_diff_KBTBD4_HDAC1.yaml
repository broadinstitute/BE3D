atom_level_naa: false
beclust3d_path: ../../beclust3d-public
clustering_radius: 6.0
skip_no_coords: true
conservation:
  alt_gene_name: null
  alt_screen_start: null
  alt_uniprot_id: null
  run: false
  v_score_threshold: 3
priority_on_alternative: false
database:
  aa_edits_col: Mutation_list
  gene_col: Gene
  edit_categories_col: Mutation_type # per-edit list, collapsed with category_priority; use guide_category_col for a one-category-per-guide column
  edit_delimiter: ;
  val_col: sgRNA_score
function_for_lfc: mean
function_for_lfc3d: mean
function_for_meta: SUM
input_chain: B, C
input_gene: KBTBD4, HDAC1
input_uniprot: Q9NVX7-2, Q13547
mode: ppi_diff
muscle_path: muscle
category_labels:
  intron:
  - Intron
  missense:
  - Missense
  no_mutation:
  - No Mutation
  nonsense:
  - Nonsense
  silent:
  - Silent
  splice:
  - Splice-donor
  - Splice-acceptor
category_priority:
- Nonsense
- Splice-donor
- Splice-acceptor
- Missense
- Silent
- Intron
- No Mutation
nRandom: 500
output_dir: ./output/ppi_diff_KBTBD4_HDAC1
ppi_chain_gene_dict:
  A: KBTBD4
  B: KBTBD4
  C: HDAC1
pthr:
  multi_screen: 0.05
  single_screen: 0.05
# negative controls for the per-screen LFC z-score null, independent of qa.controls;
# defaults to the category_labels no_mutation labels
null_controls: [No Mutation]
qa:
  cases:
  - Nonsense
  - Splice-donor
  - Splice-acceptor
  # negative controls for the QA hypothesis tests; e.g. add Silent
  controls:
  - No Mutation
  qa_only: false
  qa_passed_only: false
score_type: Meta_LFC3D
screen_dir: ./data/
screens: YeoKBTBD4-HDAC12025-ABE-Screen-PPI.tsv,YeoKBTBD4-HDAC12025-CBE-Screen-PPI.tsv
skip_existing: true
structure_radius: 6.0
user_dssp: null
user_fasta: null
user_pdb: ./pdb/8voj_KBTBD4_HDAC1_chain_ABC.pdb
sequence_source: structure # structure (default): sequence from the AF model / user_pdb, UniProt fallback on gaps or length mismatch; uniprot: always UniProt; user_fasta overrides both
on_residue_mismatch: warn # warn (default): report screen edits whose residue disagrees with the PDB/reference and continue; error: stop the run
